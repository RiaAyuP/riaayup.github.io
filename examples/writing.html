<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Sana Iyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#010000;
    --rose:#c06b83;
    --cream:#f9f5f2;
    --signal:#7d86c9;
    --rose-soft:#e8c9d1;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Comfortaa', sans-serif;
  }
  .mono{font-family:'Space Mono', monospace;}
  ::selection{background:var(--signal); color:var(--cream);}
  a{color:inherit; text-decoration:none;}

  /* ---------- NAV (same behavior as the landing page) ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 6vw;
    mix-blend-mode:difference;
    color:var(--cream);
    background:transparent;
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.08em;
    transition:background .35s ease, padding .35s ease, box-shadow .35s ease;
  }
  nav.scrolled{
    mix-blend-mode:normal;
    background:var(--cream);
    color:var(--ink);
    padding:18px 6vw;
    box-shadow:0 1px 0 rgba(1,0,0,0.08);
  }
  nav .logo{font-weight:700;}
  nav .links{display:flex; gap:28px;}
  nav .links a{opacity:0.85; transition:opacity .25s ease;}
  nav .links a:hover{opacity:1;}

  /* ---------- HEADER ---------- */
  header.page-head{
    background:var(--ink);
    color:var(--cream);
    padding:180px 6vw 100px 6vw;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.25em;
    color:var(--rose-soft);
    margin-bottom:22px;
    text-transform:uppercase;
  }
  header.page-head h1{
    font-weight:700;
    font-size:clamp(2.2rem, 6vw, 4.2rem);
    line-height:1.05;
    max-width:16ch;
  }
  header.page-head p.sub{
    font-family:'Space Mono', monospace;
    font-size:0.95rem;
    color:var(--cream);
    opacity:0.7;
    max-width:52ch;
    margin-top:24px;
    line-height:1.7;
  }

  /* ---------- POSTS ---------- */
  section.posts{
    padding:100px 6vw 140px 6vw;
    max-width:900px;
    margin:0 auto;
  }

  .status{
    font-family:'Space Mono', monospace;
    font-size:0.85rem;
    color:#6b6666;
    padding:20px 0;
  }
  .status.error{color:var(--rose);}

  .post-list{
    display:flex;
    flex-direction:column;
  }

  .post-card{
    display:block;
    padding:38px 0;
    border-top:1px solid #ddd0cd;
    transition:padding-left .3s ease;
  }
  .post-list .post-card:last-child{border-bottom:1px solid #ddd0cd;}

  .post-card:hover{padding-left:14px;}

  .post-meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--signal);
    text-transform:uppercase;
  }
  .post-meta .dot{
    width:5px; height:5px;
    border-radius:50%;
    background:var(--rose);
    display:inline-block;
  }

  .post-card h2{
    font-family:'Comfortaa', sans-serif;
    font-weight:700;
    font-size:clamp(1.25rem, 2.6vw, 1.7rem);
    margin-bottom:12px;
    transition:color .25s ease;
  }
  .post-card:hover h2{color:var(--rose);}

  .post-card p{
    font-size:0.98rem;
    line-height:1.75;
    color:#2a2626;
    max-width:66ch;
  }

  .post-card .read-more{
    display:inline-block;
    margin-top:16px;
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    color:var(--ink);
    border-bottom:1px solid var(--ink);
    padding-bottom:2px;
  }

  .archive-link{
    display:inline-block;
    margin-top:52px;
    font-family:'Space Mono', monospace;
    font-size:0.85rem;
    letter-spacing:0.05em;
    padding:14px 26px;
    border:1px solid var(--ink);
    border-radius:100px;
    transition:background .3s ease, color .3s ease;
  }
  .archive-link:hover{background:var(--ink); color:var(--cream);}

  footer{
    padding:26px 6vw;
    background:var(--ink);
    color:var(--cream);
    opacity:0.5;
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:820px){
    nav{padding:22px 6vw;}
    nav .links{gap:16px; font-size:0.68rem;}
    header.page-head{padding:150px 6vw 70px 6vw;}
    section.posts{padding:70px 6vw 100px 6vw;}
  }

  :focus-visible{
    outline:2px solid var(--signal);
    outline-offset:3px;
  }
</style>
</head>
<body>

<nav>
  <span class="logo">S. IYER</span>
  <div class="links">
    <a href="index.html#about">About</a>
    <a href="index.html#focus">Focus</a>
    <a href="writing.html">Writing</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<header class="page-head">
  <span class="eyebrow">Writing</span>
  <h1>Notes on AI, strategy, and the questions worth asking first.</h1>
  <p class="sub">The latest posts, pulled live from my Substack — <span class="mono">riaayupramudita.substack.com</span>.</p>
</header>

<section class="posts">
  <div id="status" class="status">Loading latest posts…</div>
  <div id="post-list" class="post-list"></div>
  <a class="archive-link" href="https://riaayupramudita.substack.com" target="_blank" rel="noopener">Read the full archive on Substack →</a>
</section>

<footer>
  <span>© 2026 Sana Iyer</span>
  <span>Based in Bandung, ID</span>
</footer>

<script>
  const FEED_URL = "https://riaayupramudita.substack.com/feed";
  const POST_COUNT = 5;

  // Substack's RSS feed doesn't send CORS headers, so a direct browser fetch()
  // is blocked. RSS2JSON fetches the feed server-side and hands back CORS-friendly
  // JSON, so this static page can read it client-side with no backend of its own.
  const PROXY_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED_URL);

  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('post-list');

  function formatDate(pubDate){
    const d = new Date(pubDate);
    if(isNaN(d)) return "";
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function stripHtml(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || "").trim();
  }

  function truncate(str, max = 220){
    if(!str) return "";
    return str.length > max ? str.slice(0, max).trim() + "…" : str;
  }

  function renderPosts(items){
    listEl.innerHTML = "";
    const shown = items.slice(0, POST_COUNT);
    shown.forEach((item, i) => {
      const title = item.title || "Untitled";
      const link = item.link || "#";
      const pubDate = item.pubDate || "";
      // Prefer the plain description; fall back to stripped content if needed.
      const description = truncate(stripHtml(item.description || item.content || ""));

      const card = document.createElement('a');
      card.className = 'post-card';
      card.href = link;
      card.target = '_blank';
      card.rel = 'noopener';

      card.innerHTML = `
        <div class="post-meta">
          <span>${formatDate(pubDate)}</span>
          <span class="dot"></span>
          <span>${String(i + 1).padStart(2, '0')} / ${String(shown.length).padStart(2, '0')}</span>
        </div>
        <h2>${title}</h2>
        <p>${description}</p>
        <span class="read-more">Read post →</span>
      `;

      listEl.appendChild(card);
    });
  }

  async function loadFeed(){
    try{
      const res = await fetch(PROXY_URL);
      if(!res.ok) throw new Error("Network response was not ok");
      const data = await res.json();

      if(data.status !== 'ok' || !Array.isArray(data.items)) {
        throw new Error(data.message || "Failed to parse feed");
      }
      if(data.items.length === 0) throw new Error("No posts found in feed");

      statusEl.style.display = 'none';
      renderPosts(data.items);
    } catch(err){
      statusEl.textContent = "Couldn't load posts right now — read the latest on Substack instead.";
      statusEl.classList.add('error');
    }
  }

  loadFeed();

  // Same solid-on-scroll nav behavior as the landing page.
  (function(){
    const nav = document.querySelector('nav');
    const THRESHOLD = 40;
    function updateNav(){
      nav.classList.toggle('scrolled', window.scrollY > THRESHOLD);
    }
    updateNav();
    window.addEventListener('scroll', updateNav, { passive: true });
  })();
</script>

</body>
</html>
